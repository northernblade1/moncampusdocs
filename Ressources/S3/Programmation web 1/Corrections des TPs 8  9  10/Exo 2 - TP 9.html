<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire avec Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .error-message {
            color: red;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input:invalid, select:invalid, textarea:invalid {
            border-color: red;
        }
    </style>
</head>
<body>
    <h1>Formulaire d'inscription</h1>
    <form id="registrationForm" action="" novalidate>
        <fieldset>
            <legend>Formulaire d'inscription</legend>

            <div class="form-group">
                <label for="fullname">Nom complet :</label>
                <input type="text" class="form-element" id="fullname" name="fullname" pattern="^([0-9A-Za-z]+\s?){1,3}$" maxlength="100" required title="Le Nom devrait contenir entre 1 et 3 mots.">
                <p id="error-fullname" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="email">Adresse e-mail :</label>
                <input type="email" class="form-element" id="email" name="mail" pattern="[a-z0-9._%+\-]+@uca\.ac\.ma" required title="L'adresse e-mail doit être au format nom@uca.ac.ma.">
                <p id="error-email" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe :</label>
                <input type="password" class="form-element" id="password" name="password" required minlength="8" pattern="^(?=.*[A-Z])(?=.*[0-9])(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" title="Le mot de passe doit contenir au moins 8 caractères, une majuscule, un chiffre et un symbole spécial.">
                <p id="error-password" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="phone">Numéro de téléphone :</label>
                <input type="tel" class="form-element" id="phone" name="phone" pattern="(\+212)?[0-9]{10}" required title="Le numéro doit contenir 10 chiffres ou commencer par +212 suivi de 9 chiffres.">
                <p id="error-phone" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="dateOfBirth">Date de naissance :</label>
                <input type="date" class="form-element" id="dateOfBirth" name="dateOfBirth" required max="2006-01-01" title="Vous devez avoir au moins 18 ans.">
                <p id="error-dateOfBirth" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="gender">Genre :</label>
                <select id="gender" class="form-element" name="gender" required>
                    <option value="" selected disabled hidden>--Sélectionnez un genre--</option>
                    <option value="male">Homme</option>
                    <option value="female">Femme</option>
                </select>
                <p id="error-gender" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="skills">Compétences :</label>
                <select id="skills" class="form-element" name="skills" multiple>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                </select>
                <p id="error-skills" class="error-message"></p>
            </div>

            <div class="form-group">
                <label>Centres d'intérêt :</label>
                <input type="checkbox" class="form-element" name="hobbies" value="sport"> Sport
                <input type="checkbox" class="form-element" name="hobbies" value="lecture"> Lecture
                <input type="checkbox" class="form-element" name="hobbies" value="echec"> Échec
                <p id="error-hobbies" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="website">Site Web :</label>
                <input type="url" class="form-element" id="website" name="website" title="Veuillez entrer une URL valide (ex: https://example.com)">
                <p id="error-website" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="bio">Biographie :</label>
                <textarea id="bio" name="bio" class="form-element" rows="4" maxlength="500" placeholder="Parlez-nous un peu de vous..." required></textarea>
                <p id="error-bio" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="file">Télécharger votre photo de profil (JPEG, PNG) :</label>
                <input type="file" class="form-element" id="file" name="file" accept=".jpg, .jpeg, .png" required>
                <small>Le fichier ne doit pas dépasser 2 Mo.</small>
                <p id="error-file" class="error-message"></p>
            </div>

            <button type="submit">S'inscrire</button>
        </fieldset>
    </form>

    <script>
        const form = document.getElementById('registrationForm');

        // Empêcher la soumission si le formulaire est invalide
        form.addEventListener('submit', function (event) {
            let isValid = true;
            const fields = document.getElementsByClassName('form-element');

            // Utilisation d'une boucle for pour parcourir les champs
            for (let i = 0; i < fields.length; i++) {
                const field = fields[i];
                if (!field.checkValidity()) {
                    validateField(field);
                    isValid = false;

                    // break;
                }
            }

            if (!isValid) {
            //     // Empêcher la soumission du formulaire
                event.preventDefault();
            }
        });

        // Fonction de validation d'un champ
        function validateField(field) {
            const errorElement = document.getElementById(`error-${field.id}`);
            if (errorElement) {
                errorElement.innerHTML = field.title || "Champ invalide.";
                errorElement.style.display = 'block';
            }
        }

        // Validation dynamique à chaque saisie
        // form.addEventListener('input', function (event) {
        //     validateField(event.target);
        // });

        
    </script>
</body>
</html>

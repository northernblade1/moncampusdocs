<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar Animée</title>
    <style>
        /* Style global */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        /* Conteneur de la barre de progression */
        .progress-container {
            width: 80%;
            max-width: 600px;
            background-color: #e0e0e0;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Barre de progression */
        .progress-bar {
            height: 30px;
            width: 0;
            background-color: #4caf50;
            border-radius: 25px 0 0 25px;
            text-align: center;
            color: white;
            font-weight: bold;
            line-height: 30px;
            animation: fillProgress 3s ease-in-out forwards;
        }

        /*** Animation de remplissage ***/
        /*L'animation fillProgress est appliquée à .progress-bar et fait passer la largeur de 0 à 75% en 3 secondes.
        Vous pouvez ajuster to { width: 75%; } pour indiquer une autre valeur de progression si nécessaire.

        La couleur de fond verte et le texte blanc rendent le pourcentage visible.
        animation: fillProgress 3s ease-in-out forwards; lance l'animation de remplissage en douceur et la maintient dans son état final grâce au paramètre forwards.*/
        @keyframes fillProgress {
            from { width: 0; }
            to { width: 75%; } /* Valeur de remplissage, ajustez selon les besoins */
        }
    </style>
</head>
<body>

<div class="progress-container">
    <div class="progress-bar">75%</div>
</div>

</body>
</html>

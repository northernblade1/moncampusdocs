<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice @media</title>
    <style>
        /* Style de base */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
        }

        .profile-card {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 600px;
            transition: all 0.3s ease;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-right: 20px;
        }

        .profile-details {
            flex: 1;
        }

        .profile-details h2 {
            margin: 0;
            font-size: 24px;
            color: #333;
        }

        .profile-details p {
            margin: 5px 0;
            color: #666;
        }

        /* Style responsive pour écrans petits */
        @media (max-width: 768px) {
            .profile-card {
                flex-direction: column; /* Passer en disposition verticale */
                text-align: center; /* Centrer le texte */
            }

            .profile-img {
                margin: 0 0 20px 0; /* Espacement en bas */
            }

            .profile-details h2 {
                font-size: 20px; /* Réduire la taille du texte */
            }
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <img src="https://via.placeholder.com/150" alt="Photo de profil" class="profile-img">
        <div class="profile-details">
            <h2>Sara NOANI</h2>
            <p>Développeur Web</p>
            <p>Passionné par le développement front-end et les nouvelles technologies.</p>
        </div>
    </div>
</body>
</html>

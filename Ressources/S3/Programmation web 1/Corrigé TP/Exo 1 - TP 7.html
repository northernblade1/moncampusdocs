<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider CSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #slider-section {
            width: 100%;
            height: 500px;
            position: relative;
            overflow: hidden;
        }

        .slider {
            position: relative;
            width: 100%;
            height: 100%;
        }

        input[type="radio"] {
            display: none;
        }

        .slides {
            display: flex;
            transition: transform 1s ease;
        }

        .slide {
            width: 100%;
            flex-shrink: 0;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
        }

        .control {
            width: 12px;
            height: 12px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .control:hover {
            background-color: rgba(255, 255, 255, 0.8);
        }

        #slide1:checked ~ .slides {
            transform: translateX(0%);
        }

        #slide2:checked ~ .slides {
            transform: translateX(-100%);
        }

        #slide3:checked ~ .slides {
            transform: translateX(-200%);
        }

        input[type="radio"]:nth-of-type(1):checked ~ .controls label:nth-of-type(1),
        input[type="radio"]:nth-of-type(2):checked ~ .controls label:nth-of-type(2),
        input[type="radio"]:nth-of-type(3):checked ~ .controls label:nth-of-type(3) {
            background-color: #d7d4d4;
        }
    </style>
</head>
<body>
    <section id="slider-section">
        <div class="slider">
            <input type="radio" name="slider" id="slide1" checked>
            <input type="radio" name="slider" id="slide2">
            <input type="radio" name="slider" id="slide3">

            <div class="slides">
                <div class="slide">
                    <img src="img1.jpg" alt="Image 1">
                </div>
                <div class="slide">
                    <img src="img2.jpg" alt="Image 2">
                </div>
                <div class="slide">
                    <img src="img3.jpg" alt="Image 3">
                </div>
            </div>

            <div class="controls">
                <label for="slide1" class="control"></label>
                <label for="slide2" class="control"></label>
                <label for="slide3" class="control"></label>
            </div>
        </div>
    </section>
</body>
</html>
